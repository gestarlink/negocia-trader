name: NegocIA Android APK
on:
  push:
    branches:
      - feature/negocia-trader-android
    paths:
      - 'negocia-mobile/**'
      - '.github/workflows/negocia-android.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        run: echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
      - name: Install Android SDK
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: negocia-mobile
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: negocia-trader-debug-apk
          path: negocia-mobile/app/build/outputs/apk/debug/app-debug.apk

      - name: Check release signing availability
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.NIA_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.NIA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NIA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NIA_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Release signing secrets missing. Debug APK only; no update will be published."
          fi
      - name: Restore release signing key
        if: steps.signing.outputs.available == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.NIA_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/nia-release.jks"
      - name: Build signed release APK
        if: steps.signing.outputs.available == 'true'
        working-directory: negocia-mobile
        env:
          NIA_KEYSTORE_PATH: ${{ runner.temp }}/nia-release.jks
          NIA_KEYSTORE_PASSWORD: ${{ secrets.NIA_KEYSTORE_PASSWORD }}
          NIA_KEY_ALIAS: ${{ secrets.NIA_KEY_ALIAS }}
          NIA_KEY_PASSWORD: ${{ secrets.NIA_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease
      - name: Publish in-app update v1.1.3
        if: steps.signing.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.1.3 negocia-mobile/app/build/outputs/apk/release/app-release.apk --repo "$GITHUB_REPOSITORY" --title "NIA 1.1.3 (experimental)" --notes "Experimental wake recognition improvement: checks multiple offline speech alternatives for Léo or Leonan. Keeps HayaiTTS Faber. Does not yet integrate sherpa-onnx or guarantee beep-free detection." --latest
