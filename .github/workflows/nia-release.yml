name: NIA signed beta release
on:
  push:
    branches: [feature/negocia-trader-android]
    paths:
      - 'negocia-mobile/app/build.gradle.kts'
      - 'negocia-mobile/app/src/**'
      - '.github/workflows/nia-release.yml'
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag, e.g. v0.3.0"
        required: true
        type: string
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Validate signing configuration
        env:
          KEYSTORE_B64: ${{ secrets.NIA_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.NIA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NIA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NIA_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" && test -n "$KEYSTORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD" || { echo "Missing signing secrets"; exit 1; }
          printf "%s" "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/nia-release.jks"
          test -s "$RUNNER_TEMP/nia-release.jks"
          echo "Checking keystore password and key alias..."
          keytool -list -keystore "$RUNNER_TEMP/nia-release.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null || { echo "::error::Keystore password or key alias is invalid. Recheck NIA_KEYSTORE_PASSWORD and NIA_KEY_ALIAS."; exit 1; }
          echo "Keystore credentials accepted."
          echo "Signing credentials validated for NIA 1.1.3."
      - name: Build signed APK
        working-directory: negocia-mobile
        env:
          NIA_KEYSTORE_PATH: ${{ runner.temp }}/nia-release.jks
          NIA_KEYSTORE_PASSWORD: ${{ secrets.NIA_KEYSTORE_PASSWORD }}
          NIA_KEY_ALIAS: ${{ secrets.NIA_KEY_ALIAS }}
          NIA_KEY_PASSWORD: ${{ secrets.NIA_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease
      - name: Validate signed APK
        run: |
          APK="negocia-mobile/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose "$APK"
      - name: Upload signed APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: nia-v1.1.4-signed-apk
          path: negocia-mobile/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.version || 'v1.1.4' }}
        run: |
          APK="negocia-mobile/app/build/outputs/apk/release/app-release.apk"
          gh api repos/"$GITHUB_REPOSITORY" --jq ".permissions" || true
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" --title "NIA $TAG" --notes "Beta Android do NegocIA Trader" --target "$GITHUB_SHA"
          fi
